<h2>Add Student</h2>

<form (ngSubmit)="addStudent()">

  <label>ID:</label><br>
  <input type="number" [(ngModel)]="student.id" name="id"><br><br>

  <label>Name:</label><br>
  <input type="text" [(ngModel)]="student.name" name="name"><br><br>

  <label>Email:</label><br>
  <input type="email" [(ngModel)]="student.email" name="email"><br><br>

  <label>Course:</label><br>
  <input type="text" [(ngModel)]="student.course" name="course"><br><br>

  <button type="submit">Add Student</button>

</form>
