<main class="recovery-shell"><mat-card class="recovery-card"><a routerLink="/login" class="back-link"><span class="material-icons">arrow_back</span> Back to sign in</a><div class="recovery-icon"><span class="material-icons">lock_reset</span></div><span class="section-eyebrow">Account recovery</span><h1>Reset your password</h1><p>Enter your work email and we'll send you instructions to regain access.</p><form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline" class="w-100"><mat-label>Email address</mat-label><input matInput type="email" formControlName="email" autocomplete="email" /><span matPrefix class="material-icons field-icon">mail_outline</span></mat-form-field><button mat-raised-button color="primary" class="w-100 recovery-submit" type="submit">Send reset instructions</button></form></mat-card></main>
