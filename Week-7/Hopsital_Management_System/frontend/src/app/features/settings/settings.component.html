<app-page-header title="Settings" subtitle="Configure hospital profile and operational defaults" actionLabel="Save Preferences" actionIcon="save"></app-page-header>
<div class="settings-layout"><aside class="settings-note"><span class="material-icons">tune</span><span class="section-eyebrow">Workspace settings</span><h2>Set your operational defaults.</h2><p>Keep hospital identity and team communication details current for a consistent clinical workspace.</p></aside><mat-card class="settings-card p-4"><div class="panel-heading"><span class="panel-icon material-icons">business</span><div><span class="section-eyebrow">Hospital profile</span><h5 class="fw-bold mb-0">Organisation details</h5></div></div><form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline" class="w-100 mb-3"><mat-label>Hospital Name</mat-label><input matInput formControlName="hospitalName" /></mat-form-field><mat-form-field appearance="outline" class="w-100 mb-3"><mat-label>Email</mat-label><input matInput formControlName="email" /></mat-form-field><mat-form-field appearance="outline" class="w-100 mb-3"><mat-label>Timezone</mat-label><input matInput formControlName="timezone" /></mat-form-field><button mat-raised-button color="primary" type="submit">Save preferences</button></form></mat-card></div>
