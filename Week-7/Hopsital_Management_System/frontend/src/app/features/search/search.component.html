<app-page-header title="Patient Search" subtitle="Find registered patients by name, patient ID, or phone number" actionLabel="Search" actionIcon="search"></app-page-header>
<section class="search-panel"><div class="search-box"><span class="material-icons">search</span><input [formControl]="query" (keyup.enter)="search()" placeholder="Search patient name, ID or phone number"><button mat-raised-button color="primary" (click)="search()" [disabled]="loading">{{ loading ? 'Searching…' : 'Search' }}</button></div><p>Search is not case-sensitive.</p></section>
<section class="results-grid" *ngIf="searched && groups.length"><article *ngFor="let group of groups" class="result-card"><div class="result-title"><span class="material-icons">{{ group.icon }}</span><div><h3>{{ group.title }}</h3><small>{{ group.items.length }} found</small></div></div><div class="result-list"><div *ngFor="let item of group.items" class="result-item"><strong>{{ title(group, item) }}</strong><span>{{ detail(group, item) }}</span></div></div></article></section>
<section class="search-empty" *ngIf="searched && !groups.length"><span class="material-icons">person_search</span><strong>No matching records</strong><span>Try a full or partial patient name, patient ID, or phone number.</span></section>
