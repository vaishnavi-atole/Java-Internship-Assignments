<header class="navbar">
  <div class="container nav-content">
    <a class="brand" routerLink="/" (click)="closeMenu()"><span>Cart</span>ly</a>
    <button class="menu-button" type="button" aria-label="Toggle navigation" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <nav [class.open]="menuOpen()" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a>
      <a class="cart-link" routerLink="/cart" routerLinkActive="active" (click)="closeMenu()">
        Cart <span class="badge">{{ cart.itemCount$ | async }}</span>
      </a>
    </nav>
  </div>
</header>
