<article class="task-card" [class.search-match]="isSearchMatch">
  <div class="task-card-header">
    <h2>{{ task.title }}</h2>
    <div class="badge-group">
      <span
        class="badge priority"
        [class.high]="task.priority === 'High'"
        [class.medium]="task.priority === 'Medium'"
        [class.low]="task.priority === 'Low'"
      >
        {{ task.priority }}
      </span>
      <span
        class="badge status"
        [class.pending]="task.status === 'Pending'"
        [class.progress]="task.status === 'In Progress'"
        [class.completed]="task.status === 'Completed'"
      >
        {{ task.status }}
      </span>
    </div>
  </div>

  <p class="description">{{ task.description }}</p>

  <dl class="dates">
    <div>
      <dt>Due Date</dt>
      <dd>{{ task.dueDate | date: 'mediumDate' }}</dd>
    </div>
    <div>
      <dt>Created</dt>
      <dd>{{ task.createdAt | date: 'mediumDate' }}</dd>
    </div>
  </dl>

  <div class="actions">
    <a class="btn btn-secondary" [routerLink]="['/tasks/edit', task.id]">Edit</a>
    <button class="btn btn-danger" type="button" (click)="onDelete()">Delete</button>
    <button
      class="btn btn-success"
      type="button"
      (click)="onComplete()"
      [disabled]="task.status === 'Completed'"
    >
      Mark Complete
    </button>
  </div>
</article>
